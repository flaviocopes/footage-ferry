name: BlackmagicCamImporter
options:
  bundleIdPrefix: com.flaviocopes
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "5"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  BlackmagicCamImporter:
    type: application
    platform: macOS
    sources: [BlackmagicCamImporter]
    settings:
      base:
        PRODUCT_NAME: Footage Ferry
        PRODUCT_BUNDLE_IDENTIFIER: com.flaviocopes.blackmagic-cam-importer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Footage Ferry
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Flavio Copes. MIT License. Not affiliated with Blackmagic Design."
